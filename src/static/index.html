<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>

    <!-- Add participants renderer and signup handling -->
    <script>
      (function () {
        const activitiesList = document.getElementById('activities-list');
        const activitySelect = document.getElementById('activity');
        const signupForm = document.getElementById('signup-form');
        const messageBox = document.getElementById('message');

        function escapeHTML(str) {
          return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        }

        async function fetchActivities() {
          activitiesList.innerHTML = '<p>Loading activities…</p>';
          try {
            const res = await fetch('/activities');
            if (!res.ok) throw new Error('Failed to load activities');
            const data = await res.json();
            renderActivities(data);
            populateSelect(data);
            return data;
          } catch (err) {
            activitiesList.innerHTML = '<p class="message error">Unable to load activities.</p>';
            console.error(err);
          }
        }

        function renderActivities(data = {}) {
          activitiesList.innerHTML = '';
          const names = Object.keys(data);
          if (!names.length) {
            activitiesList.innerHTML = '<p class="info">No activities available.</p>';
            return;
          }

          names.forEach((name) => {
            const info = data[name];
            const count = Array.isArray(info.participants) ? info.participants.length : 0;
            const participantsHtml = count
              ? `<ul class="participant-list">${info.participants.map(p => `<li class="participant-item">${escapeHTML(p)}</li>`).join('')}</ul>`
              : '<p class="no-participants">No participants yet.</p>';

            const card = document.createElement('div');
            card.className = 'activity-card';
            card.innerHTML = `
              <h4>${escapeHTML(name)}</h4>
              <p>${escapeHTML(info.description || '')}</p>
              <p><strong>Schedule:</strong> ${escapeHTML(info.schedule || '')}</p>

              <div class="participants-section">
                <h5>Participants <span class="badge">${count}</span></h5>
                ${participantsHtml}
              </div>
            `;
            activitiesList.appendChild(card);
          });
        }

        function populateSelect(data = {}) {
          // keep placeholder, remove rest
          while (activitySelect.options.length > 1) activitySelect.remove(1);
          Object.keys(data).forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            activitySelect.appendChild(opt);
          });
        }

        function setMessage(text, type='info') {
          messageBox.className = `message ${type}`;
          messageBox.textContent = text;
          messageBox.classList.remove('hidden');
          setTimeout(() => messageBox.classList.add('hidden'), 3500);
        }

        signupForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('email').value.trim();
          const activity = document.getElementById('activity').value;
          if (!email || !activity) return setMessage('Please provide your email and select an activity.', 'error');

          try {
            const res = await fetch(`/activities/${encodeURIComponent(activity)}/signup?email=${encodeURIComponent(email)}`, { method: 'POST' });
            const body = await res.json();
            if (!res.ok) throw new Error(body.detail || body.message || 'Signup failed');

            setMessage(body.message || 'Signed up successfully!', 'success');
            await fetchActivities();
            signupForm.reset();
          } catch (err) {
            console.error(err);
            setMessage(err.message || 'Could not sign up', 'error');
          }
        });

        // initial load
        document.addEventListener('DOMContentLoaded', fetchActivities);
      }());
    </script>
  </body>
</html>
